# ═══════════════════════════════════════════════════════════════
# PM-AJAY Backend — application.properties
#
# ⚠️  DO NOT add real secrets here.
#     All sensitive values are loaded from environment variables.
#     Copy application-local.properties.example →
#         application-local.properties  (never commit that file)
# ═══════════════════════════════════════════════════════════════

# Server
server.port=${SERVER_PORT:8081}

# ── Active Profile ───────────────────────────────────────────
# Set SPRING_PROFILES_ACTIVE=prod in production environments.
# Default = dev (permits ddl-auto=update for local development).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── MySQL Database ───────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ajay}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# ddl-auto is overridden per-profile (see application-dev.properties
# and application-prod.properties). The base value is 'validate'
# so an accidental run without a profile cannot corrupt the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ──────────────────────────────────────────────────────
# Generate a secure secret with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Mail (SMTP) ──────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Demo Mode ────────────────────────────────────────────────
# Set to true ONLY in development/staging to enable the
# /api/auth/demo endpoint for role-based quick login.
demo.mode.enabled=${DEMO_MODE_ENABLED:false}

# ── Logging ──────────────────────────────────────────────────
logging.level.com.pmajay=${LOG_LEVEL:INFO}
