# ═══════════════════════════════════════════════════════════════
# DEV profile — application-dev.properties
# Active when: SPRING_PROFILES_ACTIVE=dev  (default)
# ═══════════════════════════════════════════════════════════════

# Allow Hibernate to auto-create/update tables in local dev
spring.jpa.hibernate.ddl-auto=update

# Show SQL in dev for easier debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.pmajay=DEBUG
