# ═══════════════════════════════════════════════════════════════
# PROD profile — application-prod.properties
# Active when: SPRING_PROFILES_ACTIVE=prod
# ═══════════════════════════════════════════════════════════════

# Validate schema on startup; never auto-alter tables in production.
# Use Flyway / Liquibase for schema migrations.
spring.jpa.hibernate.ddl-auto=validate

# No SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.pmajay=WARN

# Demo endpoint is disabled in production
demo.mode.enabled=false
